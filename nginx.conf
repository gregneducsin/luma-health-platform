server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The dashboard calls the API with relative paths (see apiClient.ts),
    # resolved against window.location.origin — so in production this proxy
    # is what makes /api/* reach the api container at all, mirroring the
    # /api proxy the Vite dev server already does for local development.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
