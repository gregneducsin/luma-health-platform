services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: luma_health
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://luma:localdev@db:5432/luma_health
      PORT: "3001"
      NODE_ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    env_file:
      - path: .env
        required: false
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:3001
    ports:
      - "5173:80"

volumes:
  pgdata:
